# Render Blueprint for the Xingjian app.
#
# The repository root is the static site (served by GitHub Pages). The
# Python service lives in xingjian-agent/, so the Docker build is rooted
# there via rootDir.
#
# Free plan notes:
#   - the instance sleeps after ~15 minutes without traffic; the first
#     request afterwards takes about a minute to wake up;
#   - no persistent disk, so accounts created on the free plan can be
#     lost on redeploy. Add a disk mounted at /data on a paid plan for
#     durable accounts.
services:
  - type: web
    name: xingjian
    runtime: docker
    plan: free
    region: singapore
    rootDir: xingjian-agent
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      - key: XINGJIAN_DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "1"
      - key: XINGJIAN_TRUST_PROXY
        value: "1"
      - key: XINGJIAN_ALLOW_REGISTRATION
        value: "1"
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      # Fill these in the Render dashboard; never commit real secrets.
      - key: DEEPSEEK_API_KEY
        sync: false
      # Email verification for sign-up and password reset.
      - key: MAIL_TRANSPORT
        value: smtp
      - key: SMTP_HOST
        value: smtp.qq.com
      - key: SMTP_PORT
        value: "465"
      - key: MAIL_SECURITY
        value: ssl
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
