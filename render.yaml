# Render Blueprint for Morrow.
#
# 部署的是「一个容器，同时提供前端静态文件 + Python API + 排程引擎」：
#   浏览器 → /            → xingjian-agent/web
#          → /api/agent/*  → server.py（真模型 deepseek）
#          → /api/agent/replan → backend_services → calendar-rescheduler/backend/core.py
#
# 注意：dockerContext 是仓库根目录，因为排程引擎在 xingjian-agent 之外。
#
# 免费版注意：
#   - 15 分钟无流量会休眠，之后第一次访问要等约 1 分钟唤醒；
#   - 免费版没有持久磁盘，重新部署后账号可能丢失。
#     正式用请加一块挂到 /data 的磁盘（付费版），或改用有磁盘的 VPS。
services:
  - type: web
    name: morrow
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./xingjian-agent/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      # 不要写死 PORT：Render 会注入自己的端口，写死会导致健康检查失败
      - key: XINGJIAN_DATA_DIR
        value: /data
      # 公网必须用 HTTPS Cookie；本地调试才设 0
      - key: COOKIE_SECURE
        value: "1"
      - key: XINGJIAN_TRUST_PROXY
        value: "1"
      - key: XINGJIAN_ALLOW_REGISTRATION
        value: "1"
      # 演示期关掉邮箱验证：注册只要用户名 + 密码
      - key: XINGJIAN_REQUIRE_EMAIL
        value: "0"
      # 绝对不要在公网开启免登录（开着任何人都等于同一个 dev 账号）
      - key: XINGJIAN_DEV_BYPASS_AUTH
        value: "0"
      # 演示不需要真发邮件，验证码打到日志里
      - key: MAIL_TRANSPORT
        value: console
      # ---- 模型：在你的 key 可用的端点上填，下面这套是词元智研网关 ----
      - key: DEEPSEEK_BASE_URL
        value: https://ciyuanzhiyan.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-v4.1-flash
      - key: AGENT_MAX_TOKENS
        value: "2400"
      - key: AGENT_MOCK
        value: "0"
      # 密钥只在 Render 面板里填，永远不要进仓库
      - key: DEEPSEEK_API_KEY
        sync: false
