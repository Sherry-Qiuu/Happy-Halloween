# Render Blueprint for the Xingjian app.
#
# The repository root is the static site (served by GitHub Pages). The
# Python service lives in xingjian-agent/, so the Docker build is rooted
# there via rootDir.
#
# Free plan notes:
#   - the instance sleeps after ~15 minutes without traffic; the first
#     request afterwards takes about a minute to wake up;
#   - no persistent disk, so accounts created on the free plan can be
#     lost on redeploy. Add a disk mounted at /data on a paid plan for
#     durable accounts.
services:
  - type: web
    name: xingjian
    runtime: docker
    plan: free
    region: singapore
    rootDir: xingjian-agent
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      - key: XINGJIAN_DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "1"
      - key: XINGJIAN_TRUST_PROXY
        value: "1"
      - key: XINGJIAN_ALLOW_REGISTRATION
        value: "1"
      # Email verification is turned off for the demo: no code is sent and
      # registration only needs a username and password.
      - key: XINGJIAN_REQUIRE_EMAIL
        value: "0"
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      # Fill these in the Render dashboard; never commit real secrets.
      - key: DEEPSEEK_API_KEY
        sync: false
      # Email verification for sign-up and password reset.
      #
      # Render drops outbound SMTP connections (ports 465 and 587 both
      # time out after ~20s), so the smtp transport cannot deliver from
      # this host. The console transport prints the 6-digit code to the
      # service logs instead, which is enough for a demo: register, then
      # find "验证码" under Logs. Switch back to smtp only when sending
      # through an HTTPS mail API or a host that allows SMTP egress.
      - key: MAIL_TRANSPORT
        value: console
      - key: SMTP_HOST
        value: smtp.qq.com
      - key: SMTP_PORT
        value: "465"
      - key: MAIL_SECURITY
        value: ssl
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
