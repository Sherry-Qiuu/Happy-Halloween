let page='home',goal=0,date='2026-10-31',calendarMode='day',actual=false,reportTab=false,filter='all',selected='2026-10-31',chats={},expanded=false,recording=false;
const save=()=>{const k=window.XJ?XJ.dataKey():'xingjian-v02';localStorage.setItem(k,JSON.stringify(data));window.XJ?.queueSave?.()};const key=()=>page==='weekly'?(selected.startsWith('week-')?selected:'week-2026-10-26'):(selected.startsWith('week-')?'2026-10-31':selected);const review=()=>data.reviews[key()]||{text:'',tags:[],report:''};

function go(p){if(p==='daily'&&selected.startsWith('week-'))selected='2026-10-31';if(p==='weekly'&&!selected.startsWith('week-'))selected='week-2026-10-26';page=p;expanded=false;recording=false;reportTab=false;render()}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));$('#reflectToggle').onclick=()=>{$('#subnav').classList.toggle('hidden');$('#arrow').textContent=$('#subnav').classList.contains('hidden')?'›':'⌄'};
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));const titles={home:['今天','把注意力留给眼前的事'],project:['Project','目标 → 里程碑 → 下一步'],daily:['日反思','先看见发生了什么，再写下自己的想法'],weekly:['周反思','回看这一周，决定接下来怎么走'],settings:['设置','按自己的节奏使用行间']};$('#pageTitle').textContent=titles[page][0];$('#pageSubtitle').textContent=titles[page][1];$('#view').innerHTML=page==='home'?home():page==='project'?project():page==='settings'?settings():reflection();bind()}
function ai(context){let c=chats[chatkey()]||[];return `<section class="ai" data-context="${context}"><div class="aihead"><span><span class="spark">✧</span>行间 AI <small>· ${context==='home'?'今天':context==='project'?'当前目标':page==='weekly'?'本周':'当天'}</small></span>${expanded?'<button data-collapse style="border:0;min-height:25px;padding:0 6px;font-size:12px">收起</button>':''}</div><div class="aibody">${c.length?c.map(x=>`<div class="message ${x.role}">${esc(x.text)}</div>${x.proposal?`<div class="proposal">${context==='home'?'建议把 14:00 的练习移到 16:30–17:00；新会议为 14:00–16:00。':'建议新增下一步：用 30 分钟产出一份当前阶段的初稿，再决定如何改进。'}<div class="row"><button class="primary" data-accept="${context}">采用建议</button><button data-keep="${context}">保留现状</button></div></div>`:''}`).join(''):`<p class="welcome">${context==='home'?'今天有变化，随时告诉我。':context==='project'?'从这个目标的下一步开始。':page==='weekly'?'这一周，什么值得继续？':'今天有什么变化？'}</p><small>${context==='home'?'调整计划、补记付出，都可以从一句话开始。':context==='project'?'你决定方向，我帮你把行动变具体。':'你写自己的反思，我帮你整理事实与观察。'}</small>`}</div><form class="composer"><input aria-label="与 AI 对话" placeholder="${recording?'模拟录音中，点击停止…':'说说你的想法…'}"><button type="button" data-mic title="演示语音转写" aria-label="模拟语音输入">${recording?'■':'♩'}</button><button class="primary" aria-label="发送">↑</button></form>${context==='review'?'<button class="endchat" data-end>结束并生成观察</button>':!c.length?`<div class="chips" style="margin-top:8px"><button data-example="${context}">${context==='home'?'下午临时开会，帮我调整':'帮我想清楚下一步'}</button></div>`:''}</section>`}
function home(){return `<section class="workspace ${expanded?'expanded':''}"><div class="upper"><section class="tasks"><div class="sectionhead"><h2>今天的待办</h2><button data-add="task" aria-label="添加待办">＋</button></div><small>${data.tasks.filter(t=>t.done).length} / ${data.tasks.length} 已完成 · 按你的节奏来</small>${data.tasks.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" aria-label="完成${esc(t.title)}" data-check="${t.id}" ${t.done?'checked':''}><div class="taskbody" data-detail="${t.id}"><strong>${esc(t.title)}</strong><small>${t.minutes} 分钟 &nbsp; · &nbsp; ${esc(t.goal)}</small></div></div>`).join('')}<div class="tasknote">完成待办不会自动填入实际用时。<br>计划外做的事，也可以补记。</div><div class="row" style="margin-top:15px"><button data-add="habit">＋ 习惯</button><button data-add="actual">补记付出</button></div></section><section class="calendar"><div class="calhead"><div class="row"><button data-date="-1" aria-label="前一天">‹</button><div><h2>${date.slice(5).replace('-',' 月 ')} 日</h2><small>${date==='2026-10-31'?'星期六 · 今天':date}</small></div><button data-date="1" aria-label="后一天">›</button><button data-today>今天</button></div><div class="row"><div class="seg"><button data-mode="day" class="${calendarMode==='day'?'active':''}">日</button><button data-mode="week" class="${calendarMode==='week'?'active':''}">周</button></div><div class="seg"><button data-actual="false" class="${!actual?'active':''}">计划</button><button data-actual="true" class="${actual?'active':''}">实际</button></div></div></div><p class="calcaption">${actual?'仅展示已记录的活动；空白时段表示尚未记录。':'点击空白时段添加安排 · 日程调整需确认后生效'}</p><div class="scrollcal"><div class="timeline" id="timeline">${Array.from({length:13},(_,i)=>`<span class="hour" style="top:${i*48}px">${String(i+8).padStart(2,'0')}:00</span>`).join('')}${calendarMode==='day'?events(date):`<div class="weekgrid">${Array.from({length:7},(_,i)=>`<div class="weekcol"><div class="weeklabel">${['一','二','三','四','五','六','日'][i]} ${i<6?26+i:1}</div>${i===5?events('2026-10-31'):''}</div>`).join('')}</div>`}</div></div></section></div>${ai('home')}</section>`}
function events(d){let list=d==='2026-10-31'?(actual?[{title:'英语练习',start:9,dur:25,color:'',note:'09:00–09:25 · 已记录'},{title:'临时整理资料',start:10.333,dur:40,color:'blue',note:'10:20–11:00 · 估算'}]:[{title:'英语面试 · 自我介绍',start:data.moved?16.5:14,dur:30,color:'',note:data.moved?'16:30–17:00':'14:00–14:30'},{title:'整理作品集素材',start:11,dur:45,color:'blue',note:'11:00–11:45'},...(data.moved?[{title:'临时会议',start:14,dur:120,color:'sand',note:'14:00–16:00'}]:[])]):[];list=list.concat(data.extra.filter(e=>e.date===d&&e.actual===actual));return list.map(e=>`<button class="event ${e.color||''}" style="top:${(e.start-8)*48}px;height:${Math.max(28,e.dur/60*48)}px" data-event="${esc(e.title)}" data-note="${esc(e.note||'新增安排')}"><b>${esc(e.title)}</b>${esc(e.note||e.dur+' 分钟')}</button>`).join('')}
function project(){let g=data.goals[goal];return `<section class="workspace ${expanded?'expanded':''}"><div class="upper projectupper"><section class="tasks"><div class="sectionhead"><h2>我的目标</h2><button data-add="goal">＋</button></div>${data.goals.map((x,i)=>`<button class="goalitem ${i===goal?'active':''}" data-goal="${i}"><strong>${esc(x.title)}</strong><small>当前 · ${esc(x.stages[x.stage||0]||'全部里程碑已完成')}</small><small>期望 ${x.date.slice(5)} · 可调整</small></button>`).join('')}<p class="muted">只保留正在推进的目标，<br>让下一步始终清楚。</p></section><section class="detail"><div class="row between"><h2>${esc(g.title)}</h2><button data-editgoal>编辑目标</button></div>${g.outcomes?.length?`<div class="notice">最近确认的成果：${esc(g.outcomes[g.outcomes.length-1])}</div>`:''}<p class="goalmeta">完成标准：${esc(g.standard)}<br>期望日期 ${g.date} · 可协商，不会自动顺延</p><div class="sectionhead"><h3>里程碑</h3><small>以成果判断进展</small></div>${g.stages.map((s,i)=>`<div class="milestone ${i===(g.stage||0)?'current':''}"><span class="dot">${i<(g.stage||0)?'✓':i+1}</span><div><h3>${esc(s)} ${i===(g.stage||0)?'<span class="pill">当前阶段</span>':''}</h3><p>${i===(g.stage||0)?'先把这一阶段做具体，再安排时间。':'后续阶段，暂不展开每天的计划。'}</p>${i===(g.stage||0)?g.actions.map(a=>`<div class="actionrow"><span>${esc(a)}</span><button data-schedule="${esc(a)}">安排时间</button></div>`).join('')+'<button data-add="action" style="margin-top:10px">＋ 添加下一步</button> <button data-stage>确认阶段成果</button>':''}</div></div>`).join('')}</section></div>${ai('project')}</section>`}
function reflection(){let w=page==='weekly',r=review(),total=recordTotal(w?key():selected),entries=w?[['week-2026-10-26','10.26 — 11.01'],['week-2026-10-19','10.19 — 10.25']]:[['2026-10-31','10 月 31 日 · 今天'],['2026-10-30','10 月 30 日'],['2026-10-29','10 月 29 日']];return `<section class="reflection"><aside class="history"><h3>反思记录</h3><select aria-label="按标签筛选" id="tagfilter"><option value="all">全部标签</option>${['学习','工作','生活'].map(t=>`<option ${filter===t?'selected':''}>${t}</option>`).join('')}</select>${entries.filter(([k])=>filter==='all'||(data.reviews[k]?.tags||[]).includes(filter)).map(([k,label])=>{let x=data.reviews[k]||{};return `<button class="historyitem ${k===key()?'active':''}" data-history="${k}"><strong>${label}</strong><small>${x.text?'本人反思':'尚未填写'}${x.report?' · AI 观察':''}</small></button>`}).join('')||'<p class="empty">这个标签下还没有记录。</p>'}</aside><section class="editor"><div class="editorhead"><div class="row between"><h2>${w?'这一周':selected.slice(5).replace('-',' 月 ')+' 日'}，写给自己</h2><small id="savestate">${r.text?'已保存':'自动保存在此浏览器'}</small></div><p>这里是你的反思。AI 观察单独保存，不会改写这段文字。</p></div><div class="chips"><button data-prompt="${w?'这周值得继续的事':'今天值得记住的事'}">${w?'值得继续':'值得记住'}</button><button data-prompt="${w?'下周想调整什么':'计划与实际的变化'}">${w?'下周的调整':'发生的变化'}</button><button data-prompt="我想尝试的一个改变">一个小改变</button></div><textarea id="reflectionText" aria-label="我的反思" placeholder="不用写得完整。从一个念头、一件小事开始……">${esc(r.text)}</textarea><div class="editorbottom"><div class="chips">${['学习','工作','生活'].map(t=>`<button data-tag="${t}" class="${r.tags.includes(t)?'active':''}"># ${t}</button>`).join('')}</div><button data-save>保存反思</button></div></section><aside class="rightpanel"><section class="facts"><div class="row between"><h3>${w?'这一周的记录':'当天的记录'}</h3><small>${w?'10.26 — 11.01':selected.slice(5)}</small></div><div class="seg"><button data-report="false" class="${!reportTab?'active':''}">时间使用</button><button data-report="true" class="${reportTab?'active':''}">${w?'本周':'当天'}总结</button></div>${reportTab?(r.report?`<span class="pill">AI 观察 · 示例生成</span><p style="margin-top:16px;white-space:pre-line;font-size:13px;line-height:1.9">${esc(r.report)}</p><div class="notice">观察是帮助回看的线索。下一步如何调整，由你决定。</div>`:'<div class="empty">还没有 AI 观察报告。<br>聊一聊，点击下方“结束并生成观察”后，会保存到历史记录。</div>'):(w?`<div class="stat">${total} <small>分钟已记录</small></div><div class="weekbars">${['一','二','三','四','五','六','日'].map((d,i)=>`<div class="weekbar ${i===5&&total?'known':''}"><i></i>${d}<br>${i===5&&total?total+'m':'未记录'}</div>`).join('')}</div><p class="muted">${total?'1':'0'} / 7 天有活动记录</p><div class="notice">未记录的日期不按 0 计算，也不据此判断目标有没有推进。</div>`:selected==='2026-10-31'?`<div class="stat">${total} <small>分钟已记录</small></div><div class="bar"><i></i><i></i></div><div class="factline"><span>● 英语练习</span><span>25 分钟</span></div><div class="factline"><span>● 临时整理资料</span><span>40 分钟 · 估算</span></div>${data.extra.filter(e=>e.actual&&e.date===selected).map(e=>`<div class="factline"><span>${esc(e.title)}</span><span>${e.dur} 分钟</span></div>`).join('')}<div class="notice">来源：示例活动记录。其余时段尚未记录；计划外付出也计入这里。用时不等于目标成果。</div>`:'<div class="empty">这一天还没有活动记录。<br>不影响你直接写反思。</div>')}</section>${ai('review')}</aside></section>`}
function settings(){return `<section class="settings"><h2>我的偏好</h2><div class="settingrow"><div><h3>称呼</h3><p>显示在你的个人空间中</p></div><input id="name" aria-label="称呼" value="${esc(data.name)}"></div><div class="settingrow"><div><h3>时区</h3><p>日程与反思使用同一个时区</p></div><select aria-label="时区"><option>上海 · UTC+8</option></select></div><div class="settingrow"><div><h3>晚间反思提醒</h3><p>21:00 提醒 · 此原型仅保存偏好</p></div><input type="checkbox" id="reminder" aria-label="反思提醒" ${data.reminder?'checked':''}></div><div class="settingrow"><div><h3>演示数据</h3><p>本地保存，无真实 AI、语音识别或日历同步</p></div><button id="reset">恢复初始数据</button></div><button class="primary" id="settingsSave" style="margin-top:24px">保存设置</button></section>`}
function bind(){if($('[data-stage]'))$('[data-stage]').onclick=()=>{show('<h2>确认这一阶段的成果</h2><p class="goalmeta">这是你对成果的判断，不根据投入时长自动完成。</p><label>这次完成了什么？<input id="outcome" placeholder="例如：完成一版可回听的自我介绍"></label><div class="row"><button data-close>取消</button><button class="primary" id="confirmStage">确认完成</button></div>');$('#confirmStage').onclick=()=>{let v=$('#outcome').value.trim();if(!v)return toast('请先写下阶段成果');let g=data.goals[goal];g.outcomes??=[];g.outcomes.push(v);g.stage=(g.stage||0)+1;g.actions=[];save();$('#modal').close();render();toast('阶段成果已保存')}};document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>form(b.dataset.add));document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{data.tasks.find(t=>t.id==b.dataset.check).done=b.checked;save();render()});document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{let t=data.tasks.find(t=>t.id==b.dataset.detail);show(`<h2>${esc(t.title)}</h2><p class="goalmeta">${esc(t.goal)} · 预计 ${t.minutes} 分钟</p><p>完成状态与实际投入分别记录。</p><div class="row"><button data-close>关闭</button><button class="primary" id="detailSchedule">安排时间</button></div>`);$('#detailSchedule').onclick=()=>form('schedule',t.title)});
document.querySelectorAll('[data-event]').forEach(b=>b.onclick=e=>{e.stopPropagation();show(`<h2>${esc(b.dataset.event)}</h2><p class="goalmeta">${esc(b.dataset.note)} · ${actual?'实际记录':'当前计划'}</p><p>临时有变化，可以告诉下方 AI，确认建议后再调整。</p><div class="row"><button data-close>关闭</button></div>`)});
document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+Number(b.dataset.date));date=d.toISOString().slice(0,10);render()});if($('[data-today]'))$('[data-today]').onclick=()=>{date='2026-10-31';render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{calendarMode=b.dataset.mode;render()});document.querySelectorAll('[data-actual]').forEach(b=>b.onclick=()=>{actual=b.dataset.actual==='true';render()});if($('#timeline'))$('#timeline').onclick=e=>{if(calendarMode==='week')return toast('周视图用于总览；切到日视图选择具体时段。');const y=e.clientY-e.currentTarget.getBoundingClientRect().top;form('schedule','',Math.min(20,8+Math.floor(y/24)/2))};
document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{goal=Number(b.dataset.goal);render()});document.querySelectorAll('[data-schedule]').forEach(b=>b.onclick=()=>form('schedule',b.dataset.schedule));if($('[data-editgoal]'))$('[data-editgoal]').onclick=()=>form('editgoal');
document.querySelectorAll('.composer').forEach(f=>{let input=f.querySelector('input');input.onfocus=()=>{if(page==='home'||page==='project'){$('.workspace').classList.add('expanded');expanded=true}};f.onsubmit=e=>{e.preventDefault();send(input.value);input.value=''}});document.querySelectorAll('[data-mic]').forEach(b=>b.onclick=()=>{recording=!recording;b.textContent=recording?'■':'♩';let input=b.closest('form').querySelector('input');input.placeholder=recording?'模拟录音中，点击停止…':'说说你的想法…';if(!recording){input.value=page==='home'?'今天下午两点到四点临时开会':'今天有一件计划外的事，也值得记下来';toast('示例转写已填入，可修改后发送')}else toast('语音状态演示，不会调用麦克风')});document.querySelectorAll('[data-collapse]').forEach(b=>b.onclick=()=>{expanded=false;render()});document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>send(b.dataset.example==='home'?'下午两点到四点临时开会，帮我调整':'帮我想清楚下一步'));
document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>{if(b.dataset.accept==='home')data.moved=true;else data.goals[goal].actions.push('产出当前阶段的初稿并检查 · 30 分钟');(chats[chatkey()]||[]).forEach(m=>m.proposal=false);save();render();toast('已采用建议')});document.querySelectorAll('[data-keep]').forEach(b=>b.onclick=()=>{(chats[chatkey()]||[]).forEach(m=>m.proposal=false);render();toast('已保留当前安排')});
if($('#reflectionText'))$('#reflectionText').oninput=e=>{let r=review();r.text=e.target.value;data.reviews[key()]=r;save();$('#savestate').textContent='已保存'};document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{let t=$('#reflectionText');t.value+=(t.value?'\n\n':'')+b.dataset.prompt+'：\n';t.dispatchEvent(new Event('input'));t.focus()});document.querySelectorAll('[data-tag]').forEach(b=>b.onclick=()=>{let r=review(),t=b.dataset.tag;r.tags=r.tags.includes(t)?r.tags.filter(x=>x!==t):[...r.tags,t];data.reviews[key()]=r;save();render()});if($('[data-save]'))$('[data-save]').onclick=()=>{render();toast('本人反思已保存')};document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{selected=b.dataset.history;reportTab=false;render()});if($('#tagfilter'))$('#tagfilter').onchange=e=>{filter=e.target.value;render()};document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{reportTab=b.dataset.report==='true';render()});if($('[data-end]'))$('[data-end]').onclick=generate;
if($('#settingsSave'))$('#settingsSave').onclick=()=>{data.name=$('#name').value.trim()||'明';data.reminder=$('#reminder').checked;save();toast('设置已保存在此浏览器')};if($('#reset'))$('#reset').onclick=()=>{show('<h2>恢复演示数据？</h2><p class="goalmeta">将清除本原型中保存的反思、目标和改动。</p><div class="row"><button data-close>取消</button><button class="primary" id="confirmReset">恢复</button></div>');$('#confirmReset').onclick=()=>{data=structuredClone(seed);chats={};save();$('#modal').close();render();toast('已恢复初始数据')}}}
function chatkey(){return page==='home'?'home':page==='project'?'project-'+goal:'review-'+key()}
function send(value){let text=value.trim();if(!text)return;let k=chatkey(),context=page==='home'?'home':page==='project'?'project':'review';chats[k]??=[];let reply=context==='home'?'我整理了一份调整草案，请确认是否采用。':context==='project'?'可以先用一个小行动检验这个阶段的目标。下面是待确认的建议。':'这件事我记下了。它对你的感受或原计划有什么影响？';chats[k].push({role:'user',text},{role:'assistant',text:'[交互示例] '+reply,proposal:context!=='review'});expanded=true;render();let a=$('.aibody');a.scrollTop=a.scrollHeight}
function recordTotal(k){const week=k.startsWith('week-');return ((k==='2026-10-31'||k==='week-2026-10-26')?65:0)+data.extra.filter(e=>e.actual&&(week?(e.date>=k.slice(5)&&e.date<=new Date(new Date(k.slice(5)+'T12:00:00').getTime()+6*86400000).toISOString().slice(0,10)):e.date===k)).reduce((n,e)=>n+e.dur,0)}
function generate(){let r=review(),c=chats[chatkey()]||[],u=c.filter(x=>x.role==='user').map(x=>x.text);r.report=(page==='weekly'?'本周观察':'每日 AI 观察')+'\n\n'+(selected==='2026-10-31'||page==='weekly'?'已记录的投入：英语练习 25 分钟；临时整理资料约 40 分钟。其余时段缺少记录。':'这一天尚无活动记录。')+(u.length?'\n\n你提到：'+u.join('；'):'\n\n本次未补充聊天内容，仅根据现有记录整理。')+(data.extra.some(e=>e.actual)?'\n\n新增活动记录已纳入时间使用页。':'')+'\n\n待你判断：这些变化意味着什么？是否需要改变下一步？\n\n（固定逻辑演示，未调用真实 AI）';data.reviews[key()]=r;save();reportTab=true;render();toast(filter==='all'?'AI 观察已更新到这条历史记录':'AI 观察已保存；当前标签筛选可能隐藏该记录')}
function show(html){$('#modal').innerHTML=html;$('#modal').showModal();$('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#modal').close())}
function form(type,title='',hour=14){let g=data.goals[goal],edit=type==='editgoal',isgoal=type==='goal'||edit,isaction=type==='action';let names={task:'添加待办',habit:'添加习惯',actual:'补记付出',schedule:'安排时间',goal:'添加目标',editgoal:'编辑目标',action:'添加下一步'};show(`<form id="entryForm"><h2>${names[type]}</h2><label>${isgoal?'目标':'名称'}<input name="title" required maxlength="100" value="${esc(edit?g.title:title)}" placeholder="具体想做什么？"></label>${isgoal?`<label>完成标准<input name="standard" required value="${esc(edit?g.standard:'')}" placeholder="什么结果代表完成？"></label><label>期望日期（可调整）<input name="date" type="date" required value="${edit?g.date:'2026-11-27'}"></label>`:`<label>预计${type==='actual'?'实际投入':'用时'}（分钟）<input name="minutes" type="number" min="5" max="480" step="5" value="30" required></label>${type==='schedule'||type==='actual'?`<div class="row" style="margin-top:0"><label>日期<input name="date" type="date" required value="${date}"></label><label>开始时间<input name="time" type="time" required value="${String(Math.floor(hour)).padStart(2,'0')}:${hour%1?'30':'00'}" min="00:00" max="23:59"></label></div>`:''}${type==='habit'?'<p class="notice">本版展示每天重复的习惯；复杂重复规则留待后续。</p>':''}`}<div class="row"><button type="button" data-close>取消</button><button class="primary">${type==='actual'?'保存记录':'保存'}</button></div></form>`);$('#entryForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),n=f.get('title').trim();if(!n)return;let m=Number(f.get('minutes'));if(isgoal){let obj={title:n,standard:f.get('standard'),date:f.get('date'),stages:edit?g.stages:['明确第一阶段成果','推进关键行动','检查完成结果'],actions:edit?g.actions:[],stage:edit?(g.stage||0):0,outcomes:edit?(g.outcomes||[]):[]};if(edit)data.goals[goal]=obj;else{data.goals.push(obj);goal=data.goals.length-1}}else if(isaction)g.actions.push(n+' · '+m+' 分钟');else if(type==='schedule'||type==='actual'){let [h,mm]=f.get('time').split(':').map(Number);data.extra.push({title:n,date:f.get('date'),start:h+mm/60,dur:m,actual:type==='actual',note:f.get('time')+' · '+m+' 分钟',color:type==='actual'?'blue':''});if(type==='actual')toast('实际记录已保存；不会改写计划')}else data.tasks.push({id:Date.now(),title:n,minutes:m,goal:type==='habit'?'习惯 · 每天':'未关联目标',done:false});save();$('#modal').close();render()}}
