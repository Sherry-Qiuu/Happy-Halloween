# /etc/nginx/sites-available/xingjian
#
# Replace example.com with your domain, point the certificate paths at
# your real files, then:
#   sudo ln -s /etc/nginx/sites-available/xingjian \
#              /etc/nginx/sites-enabled/xingjian
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app listens on 127.0.0.1:8000 (see docker-compose.yml). Set
# COOKIE_SECURE=1 and XINGJIAN_TRUST_PROXY=1 in .env behind this proxy.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The AI panel uses server-sent events; do not buffer them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
