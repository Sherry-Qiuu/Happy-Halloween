# Publish the static site to GitHub Pages.
#
# The single source of truth is xingjian-agent/web: the Python service
# serves that folder, and this workflow publishes the same files to Pages.
# The Python service (xingjian-agent/) keeps running on its own host.
#
# actions/configure-pages with enablement: true turns Pages on for the
# repository the first time this runs, so no manual settings change is
# needed when the repository is public (or on a plan that allows Pages
# from private repositories).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the static site
        run: |
          set -eu
          mkdir -p _site
          for file in xingjian-agent/web/*.html xingjian-agent/web/*.css xingjian-agent/web/*.js; do
            cp "$file" _site/
          done
          : > _site/.nojekyll
          ls -la _site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
